name: Actualizar catálogo Eroski

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actualizar-catalogo-eroski.yml'
      - 'scripts/descargar-catalogo-eroski.mjs'
      - 'scripts/catalogos-supermercados.mjs'
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo-eroski-diario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar productos y precios de hoy
        run: npm run actualizar-eroski

      - name: Validar el catálogo generado
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('public/catalogo-eroski.json','utf8'));if(c.version!==2||!Array.isArray(c.productos)||c.productos.length<3000||c.totalProductos!==c.productos.length||!c.actualizado||!c.fechaPrecios)throw new Error('Catálogo incompleto');console.log(c.actualizado,c.productos.length)"

      - name: Publicar la actualización
        run: |
          if git diff --quiet -- public/catalogo-eroski.json; then
            echo "El catálogo ya estaba actualizado."
            exit 0
          fi
          git config user.name "PFI Catálogo"
          git config user.email "actions@users.noreply.github.com"
          git add public/catalogo-eroski.json
          git commit -m "data: actualizar catálogo Eroski"
          git pull --rebase origin main
          git push
