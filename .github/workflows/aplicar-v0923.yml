name: Aplicar revisión integral v0.9.23

on:
  push:
    branches: [main]
    paths:
      - 'scripts/aplicar-v0923.py'
      - '.github/workflows/aplicar-v0923.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar cambios v0.9.23
        run: python3 scripts/aplicar-v0923.py

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build completo
        run: npm run build

      - name: Coherencia v0.9.23
        run: npm run test:coherencia-v0923

      - name: Reglas de menú
        run: npm run test:reglas-menu

      - name: Comensales y cantidades
        run: npm run test:comensales

      - name: Auditoría mensual
        run: npm run test:auditoria-mensual

      - name: Resto de pruebas críticas
        run: npm run test:calendario && npm run test:menu-mensual && npm run test:cuenta && npm run test:compra-v0921 && npm run test:copias && npm run test:rescate-json

      - name: Guardar solo si todo es correcto
        shell: bash
        run: |
          rm -f scripts/aplicar-v0923.py .github/workflows/aplicar-v0923.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: corregir kebab, legumbres y ampliar recetario v0.9.23'
          git push origin HEAD:main
