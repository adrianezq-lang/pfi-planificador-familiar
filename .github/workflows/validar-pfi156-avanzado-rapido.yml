name: Validar PFI 1.5.6 avanzado rápido

on:
  push:
    branches:
      - pfi-1.5.6-ui-1.5.5
    paths:
      - '.github/workflows/validar-pfi156-avanzado-rapido.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfi-1.5.6-ui-1.5.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Aplicar y probar funciones avanzadas
        shell: bash
        run: |
          set +e
          mkdir -p recovered/validation-fast
          node scripts/preparar-imports-node-156.mjs > recovered/validation-fast/imports.log 2>&1
          IMPORTS=$?
          node scripts/preparar-marcas-ui-avanzada-156.mjs > recovered/validation-fast/markers.log 2>&1
          MARKERS=$?
          node scripts/aplicar-funciones-avanzadas-156.mjs > recovered/validation-fast/apply.log 2>&1
          APPLY=$?
          node scripts/reforzar-funciones-avanzadas-156.mjs > recovered/validation-fast/reinforce.log 2>&1
          REINFORCE=$?
          node scripts/reforzar-coherencia-inventario-156.mjs > recovered/validation-fast/coherencia-apply.log 2>&1
          COHERENCIA_APPLY=$?
          node scripts/probar-coherencia-inventario-156.mjs > recovered/validation-fast/coherencia-tests.log 2>&1
          COHERENCIA_TESTS=$?
          node scripts/preparar-marcas-stock-real-156.mjs > recovered/validation-fast/stock-markers.log 2>&1
          STOCK_MARKERS=$?
          node scripts/aplicar-stock-real-156.mjs > recovered/validation-fast/stock-apply.log 2>&1
          STOCK_APPLY=$?
          node scripts/aplicar-pestana-postres-156.mjs > recovered/validation-fast/postres-apply.log 2>&1
          POSTRES_APPLY=$?
          node scripts/probar-pestana-postres-156.mjs > recovered/validation-fast/postres-tests.log 2>&1
          POSTRES_TESTS=$?
          node scripts/aplicar-copia-seguridad-156.mjs > recovered/validation-fast/backup-apply.log 2>&1
          BACKUP_APPLY=$?
          node scripts/preparar-imports-node-156.mjs >> recovered/validation-fast/imports.log 2>&1
          IMPORTS2=$?
          node --experimental-strip-types scripts/probar-copia-seguridad-156.mjs > recovered/validation-fast/backup-tests.log 2>&1
          BACKUP_TESTS=$?
          node --experimental-strip-types scripts/probar-stock-real-156.mjs > recovered/validation-fast/stock-tests.log 2>&1
          STOCK_TESTS=$?
          node --experimental-strip-types scripts/probar-funciones-avanzadas-156.mjs > recovered/validation-fast/tests.log 2>&1
          TESTS=$?
          npm run typecheck > recovered/validation-fast/typecheck.log 2>&1
          TYPECHECK=$?
          npx vite build > recovered/validation-fast/vite.log 2>&1
          VITE=$?
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "imports=$IMPORTS"
            echo "markers=$MARKERS"
            echo "apply=$APPLY"
            echo "reinforce=$REINFORCE"
            echo "coherencia_apply=$COHERENCIA_APPLY"
            echo "coherencia_tests=$COHERENCIA_TESTS"
            echo "stock_markers=$STOCK_MARKERS"
            echo "stock_apply=$STOCK_APPLY"
            echo "stock_tests=$STOCK_TESTS"
            echo "postres_apply=$POSTRES_APPLY"
            echo "postres_tests=$POSTRES_TESTS"
            echo "backup_apply=$BACKUP_APPLY"
            echo "backup_tests=$BACKUP_TESTS"
            echo "imports_post=$IMPORTS2"
            echo "tests=$TESTS"
            echo "typecheck=$TYPECHECK"
            echo "vite=$VITE"
            if [ "$IMPORTS" -eq 0 ] && [ "$MARKERS" -eq 0 ] && [ "$APPLY" -eq 0 ] && [ "$REINFORCE" -eq 0 ] && [ "$COHERENCIA_APPLY" -eq 0 ] && [ "$COHERENCIA_TESTS" -eq 0 ] && [ "$STOCK_MARKERS" -eq 0 ] && [ "$STOCK_APPLY" -eq 0 ] && [ "$STOCK_TESTS" -eq 0 ] && [ "$POSTRES_APPLY" -eq 0 ] && [ "$POSTRES_TESTS" -eq 0 ] && [ "$BACKUP_APPLY" -eq 0 ] && [ "$BACKUP_TESTS" -eq 0 ] && [ "$IMPORTS2" -eq 0 ] && [ "$TESTS" -eq 0 ] && [ "$TYPECHECK" -eq 0 ] && [ "$VITE" -eq 0 ]; then
              echo "resultado=OK"
            else
              echo "resultado=ERROR"
            fi
          } > recovered/validation-fast/estado.txt
          exit 0
      - name: Publicar resultado
        run: |
          git config user.name 'PFI Validation Bot'
          git config user.email 'actions@github.com'
          git add -f recovered/validation-fast
          git commit -m 'Guarda validación rápida PFI 1.5.6 avanzada' || true
          git push origin HEAD:pfi-1.5.6-advanced-fast-validation --force
