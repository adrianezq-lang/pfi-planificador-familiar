name: Recuperar funciones PFI 1.5.6

on:
  push:
    branches:
      - pfi-1.5.6-ui-1.5.5
    paths:
      - '.github/workflows/recuperar-funciones-pfi156.yml'

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guardar interfaz anterior para comparar
        run: |
          mkdir -p .pfi-ui-1.5.5
          cp -R src .pfi-ui-1.5.5/src

      - name: Extraer paquete 1.5.6 truncado
        run: node scripts/restaurar-integral.mjs

      - name: Guardar código recuperado como evidencia
        run: |
          rm -rf recovered/pfi-1.5.6
          mkdir -p recovered/pfi-1.5.6
          cp -R src recovered/pfi-1.5.6/src
          if [ -d public ]; then cp -R public recovered/pfi-1.5.6/public; fi

      - name: Publicar recuperación en rama aislada
        run: |
          git config user.name 'PFI Recovery Bot'
          git config user.email 'actions@github.com'
          git add recovered/pfi-1.5.6
          git commit -m 'Guarda código extraído del paquete PFI 1.5.6' || true
          git push origin HEAD:pfi-1.5.6-feature-recovery --force
